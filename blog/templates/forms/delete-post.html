{% extends 'parent/base.html' %}
{% load static %}

{% block title %}حذف مطلب{% endblock %}

{% block content %}
<section>
    <div class="container" style="max-width:620px">
        <div class="form-card" style="text-align:center">
            <h2 style="margin:0 0 10px;font-size:21px">حذف مطلب</h2>
            <p style="color:var(--muted);margin:0 0 6px">آیا از حذف این مطلب مطمئنی؟</p>
            <p style="font-weight:600;margin:0 0 22px">«{{ post.title }}»</p>
            <div class="alert alert-warning" style="text-align:start;margin-bottom:22px">
                با حذف مطلب، تصاویر و دیدگاه‌های آن هم حذف می‌شوند و قابل بازگشت نیستند.
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="form-actions" style="justify-content:center">
                    <button class="btn btn-danger" type="submit">بله، حذف کن</button>
                    <a class="btn btn-ghost" href="{% url 'blog:profile' %}">انصراف</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
