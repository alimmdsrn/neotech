{% extends 'parent/base.html' %}
{% load static %}

{% block title %}ورود{% endblock %}

{% block content %}
<section>
    <div class="container auth-wrap">
        <div class="form-card">
            <h2 style="margin:0 0 6px;font-size:21px">ورود به حساب</h2>
            <p style="margin:0 0 20px;color:var(--muted);font-size:14.5px">برای مدیریت مطالب وارد شو.</p>

            {% if form.errors %}
            <div class="alert alert-error" style="margin-bottom:18px">نام کاربری یا رمز عبور درست نیست.</div>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}
                {{ form.as_p }}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="form-actions">
                    <button class="btn btn-primary btn-block" type="submit">ورود</button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
